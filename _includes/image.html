{%- assign image = site.data.images[include.src] -%}
{%- assign image_loading = include.loading | default: 'lazy' -%}
{%- if image.variants.size > 0 -%}
<picture>
  <source type="image/webp" srcset="{% for variant in image.variants %}{{ variant.url | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ include.sizes | default: '(max-width: 800px) calc(100vw - 30px), 740px' | escape }}">
{%- endif -%}
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" width="{{ image.width }}" height="{{ image.height }}" loading="{{ image_loading }}" decoding="async"{% if include.class %} class="{{ include.class | escape }}"{% endif %}>
{%- if image.variants.size > 0 -%}
</picture>
{%- endif -%}
