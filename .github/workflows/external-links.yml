name: External link report

# Network failures and bot protection are reported separately from deployment.
on:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JEKYLL_ENV: production
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          bundler: "2.4.17"
          bundler-cache: true
      - run: bundle exec jekyll build
      - name: Report external links needing review
        run: python3 scripts/check-external-links.py
